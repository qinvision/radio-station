const SECTION_META = {
  part1:{label:"第一部分 · 官方外宣类电台", no:"01"},
  part2:{label:"第二部分 · 宗教类电台", no:"02"},
  part3:{label:"第三部分 · 其他电台", no:"03"},
  appendix:{label:"附录 · 对华英语广播", no:"A"}
};
const ORDER = ["part1","part2","part3","appendix"];
const $ = s=>document.querySelector(s);
const esc = t=>t.replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

// 免责声明
(function(){
  const d = RECORDS.filter(r=>r.section==="disclaimer");
  if(d.length){ $("#discBox").innerHTML = "<b>免责声明</b><br>" + esc(d[1]?d[1].text:d[0].text); }
})();

// 构建分组：section -> stations[]
function buildModel(){
  const sections = {};
  ORDER.forEach(k=>sections[k]={stations:[]});
  let cur=null;
  for(const r of RECORDS){
    if(r.section==="disclaimer") continue;
    if(r.type==="part"){ cur=null; continue; }
    if(r.type==="station"){
      if(cur && cur.lines.length===0 && cur.notes.length===0){
        // 电台名重复两行（英文行 + 中文行）：合并标题，去重
        if(cur.title!==r.text) cur.title = cur.title + " / " + r.text;
      } else {
        cur={title:r.text, lines:[], notes:[]};
        sections[r.section].stations.push(cur);
      }
    } else if(r.type==="note"){
      if(!cur){ sections[r.section].stations.push({title:"",lines:[],notes:[]}); cur=sections[r.section].stations[sections[r.section].stations.length-1]; }
      cur.notes.push(r.text);
    } else {
      if(!cur){ sections[r.section].stations.push({title:"",lines:[],notes:[]}); cur=sections[r.section].stations[sections[r.section].stations.length-1]; }
      cur.lines.push(r);
    }
  }
  return sections;
}
const MODEL = buildModel();

function highlight(text, q){
  let s=esc(text);
  if(q){ const re=new RegExp(q.replace(/[.*+?^${}()|[\]\\]/g,"\\$&"),"gi"); s=s.replace(re,m=>"<span class='hl'>"+m+"</span>"); }
  return s;
}
function freqLine(r,q){
  // 时段 = 行首 HHMM-HHMM / 次日HHMM；其余为频率正文
  const m=r.text.match(/^(\d{4}\s*-\s*(?:次日)?\d{4})(.*)$/);
  let time="", body=r.text;
  if(m){ time=m[1]; body=m[2].trim(); }
  // 频率数字加强调
  let bodyHtml=highlight(body,q).replace(/(\d{4,5}(?:\(MW\))?)/g,"<b>$1</b>");
  return `<div class="freq"><span class="time">${esc(time)}</span><span class="body">${bodyHtml}</span></div>`;
}

let active="all", query="";
function render(){
  const q=query.trim();
  const box=$("#content"); box.innerHTML="";
  let totalSt=0, totalFreq=0;
  for(const key of ORDER){
    if(active!=="all" && active!==key) continue;
    const meta=SECTION_META[key];
    const stations=MODEL[key].stations;
    const secEl=document.createElement("section"); secEl.className="section";
    let visible=0, freqCount=0;
    let cardsHtml="";
    stations.forEach(st=>{
      // 命中判断：标题 / 任意行 / 备注含 q
      const hay=[st.title, ...st.lines.map(l=>l.text), ...st.notes].join("\n");
      if(q && !hay.toLowerCase().includes(q.toLowerCase())) return;
      visible++; totalSt++;
      let html="";
      if(st.title){
        const titles=st.title.split(" / ");
        const main=highlight(titles[0],q);
        const sub=titles.slice(1).map(t=>highlight(t,q)).join(" · ");
        const h=titles.length>1? main+`<span class='sub'>${sub}</span>`:main;
        html+=`<h3>${h}</h3>`;
      }
      const titleHit = !q || st.title.toLowerCase().includes(q.toLowerCase());
      let langActive=false;
      st.lines.forEach(l=>{
        const hit = !q || l.text.toLowerCase().includes(q.toLowerCase());
        if(l.type==="lang" || l.type==="subhead"){
          langActive = hit;
          if(titleHit || hit) html+=l.type==="lang" ? `<div class="lang">${highlight(l.text,q)}</div>` : `<div class="subhead">${highlight(l.text,q)}</div>`;
        } else if(l.type==="freq"){
          if(titleHit || hit || langActive){ html+=freqLine(l,q); freqCount++; totalFreq++; }
        } else {
          if(titleHit || hit) html+=`<div class="freq"><span class="time"></span><span class="body">${highlight(l.text,q)}</span></div>`;
        }
      });
      st.notes.forEach(n=>{ if(!q || n.toLowerCase().includes(q.toLowerCase())) html+=`<div class="note">${highlight(n.replace(/^注[:：]\s*/,""),q)}</div>`; });
      if(html) cardsHtml+=`<article class="station">${html}</article>`;
    });
    if(!stations.length || visible===0) continue;
    secEl.innerHTML=`<div class="section-head"><span class="no">${meta.no}</span><h2>${meta.label}</h2><span class="cnt">${visible} 家电台 · ${freqCount} 条频率</span></div><div class="grid">${cardsHtml}</div>`;
    box.appendChild(secEl);
  }
  if(!box.children.length) box.innerHTML=`<div class="empty">没有匹配「${esc(q)}」的电台或频率</div>`;
}

// 节筛选按钮
(function(){
  const tabs=$("#tabs");
  const items=[["all","全部"],...ORDER.map(k=>[k,SECTION_META[k].label.split(" · ")[1]||SECTION_META[k].label])];
  tabs.innerHTML=items.map(([v,l])=>`<button class="tab${v==="all"?" on":""}" data-v="${v}">${l}</button>`).join("");
  tabs.addEventListener("click",e=>{ const b=e.target.closest(".tab"); if(!b)return; active=b.dataset.v; tabs.querySelectorAll(".tab").forEach(x=>x.classList.toggle("on",x===b)); render(); });
})();
$("#q").addEventListener("input",e=>{query=e.target.value; render();});
render();
</script>
