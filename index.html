<!DOCTYPE html>
<html lang="zh-CN" data-theme="day"><head><meta http-equiv="Content-Type" content="text/html; charset=UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>云端网络电台</title>
<style>
:root { --topbar-h: 120px; }
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html[data-theme="night"]{ --bg:#0d1017; --card:#161c28; --card-2:#1c2433; --text:#e8ecf4; --text-2:#8b96ab; --border:rgba(255,255,255,.08); --accent:#4f8cff; --accent-2:#7aa9ff; --accent-soft:rgba(79,140,255,.15); --shadow:0 8px 28px rgba(0,0,0,.45); --glass:rgba(22,28,40,.82); }
html[data-theme="day"]{ --bg:#f2f5fa; --card:#ffffff; --card-2:#f4f7fc; --text:#161a22; --text-2:#6b7488; --border:rgba(0,0,0,.08); --accent:#2563eb; --accent-2:#3b82f6; --accent-soft:rgba(37,99,235,.10); --shadow:0 8px 24px rgba(24,40,80,.10); --glass:rgba(255,255,255,.86); }
html[data-theme="green"]{ --bg:#e6efe3; --card:#f7fbf5; --card-2:#eef5ea; --text:#26331f; --text-2:#5f7355; --border:rgba(40,70,30,.12); --accent:#4a8c3f; --accent-2:#63a854; --accent-soft:rgba(74,140,63,.13); --shadow:0 8px 24px rgba(40,70,30,.12); --glass:rgba(247,251,245,.88); }
html[data-theme="red"]{ --bg:#171012; --card:#241a1d; --card-2:#2e2125; --text:#f6e9ea; --text-2:#b09094; --border:rgba(255,255,255,.09); --accent:#e0364b; --accent-2:#ff5f72; --accent-soft:rgba(224,54,75,.16); --shadow:0 8px 28px rgba(0,0,0,.5); --glass:rgba(36,26,29,.84); }
html[data-theme="ocean"]{ --bg:#07131c; --card:#0e2230; --card-2:#143040; --text:#dff0f8; --text-2:#7ba3b7; --border:rgba(255,255,255,.09); --accent:#17a8cf; --accent-2:#3cc9ea; --accent-soft:rgba(23,168,207,.16); --shadow:0 8px 28px rgba(0,0,0,.5); --glass:rgba(14,34,48,.84); }
html[data-theme="violet"]{ --bg:#120e1c; --card:#1c1630; --card-2:#261e40; --text:#ece6f9; --text-2:#9d92b8; --border:rgba(255,255,255,.09); --accent:#9b6dff; --accent-2:#b892ff; --accent-soft:rgba(155,109,255,.16); --shadow:0 8px 28px rgba(0,0,0,.5); --glass:rgba(28,22,48,.84); }
body{ margin:0; min-height:100vh; background:var(--bg); color:var(--text); font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei","Source Han Sans SC","Noto Sans CJK SC",sans-serif; transition:background .3s,color .3s; }
::-webkit-scrollbar{ width:10px; height:10px; }
::-webkit-scrollbar-track{ background:transparent; }
::-webkit-scrollbar-thumb{ background:rgba(128,140,160,.35); border-radius:6px; }
::-webkit-scrollbar-thumb:hover{ background:rgba(128,140,160,.55); }
.topbar{ position:fixed; top:0; left:0; right:0; z-index:95; display:flex; flex-direction:column; background:var(--glass); border-bottom:1px solid var(--border); box-shadow:0 4px 22px rgba(0,0,0,.14); backdrop-filter:blur(16px); -webkit-backdrop-filter:blur(16px); padding-top:env(safe-area-inset-top); }
.topbar-row{ display:flex; align-items:center; gap:12px; padding:8px 18px; min-width:0; }
.topbar-row-1{ padding-bottom:6px; }
.topbar-row-2{ padding-top:8px; padding-bottom:10px; flex-wrap:wrap; border-top:1px solid var(--border); }
.clock{ display:flex; align-items:baseline; gap:10px; flex:none; user-select:none; }
.clock-time{ font-size:20px; font-weight:700; letter-spacing:.5px; font-variant-numeric:tabular-nums; white-space:nowrap; color:var(--text); }
.clock-date{ font-size:12px; color:var(--text-2); white-space:nowrap; }
.brand{ flex:1; min-width:0; text-align:center; line-height:1.15; padding:0 8px; }
.brand h1{ font-size:18px; font-weight:700; margin:0; letter-spacing:2px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; color:var(--text); }
.brand p{ font-size:12px; margin:2px 0 0; color:var(--text-2); letter-spacing:1.5px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.topbar-right{ margin-left:auto; display:flex; align-items:center; gap:10px; flex:none; }
.export-btn{ font-size:13px; padding:7px 12px; border-radius:10px; border:1px solid var(--border); background:var(--card-2); color:var(--accent); cursor:pointer; font-family:inherit; white-space:nowrap; transition:all .2s cubic-bezier(.4,0,.2,1); font-weight:600; }
.export-btn:hover{ border-color:var(--accent); filter:brightness(1.12); transform:translateY(-1px); box-shadow:0 4px 12px var(--accent-soft); }
.export-btn:active{ transform:scale(.96); }
.lock-btn{ width:36px; height:36px; flex:none; border-radius:11px; display:flex; align-items:center; justify-content:center; border:1px solid var(--border); background:var(--card-2); color:var(--accent); cursor:pointer; font-family:inherit; line-height:1; transition:all .18s; }
.lock-btn svg{ width:16px; height:16px; display:block; }
.lock-btn:hover{ border-color:var(--accent); filter:brightness(1.12); }
.lock-btn:active{ transform:scale(.94); }
.lock-btn.locked{ color:var(--text-2); }
.theme-switch{ display:flex; align-items:center; gap:8px; padding:7px 11px; border-radius:999px; background:var(--card-2); border:1px solid var(--border); }
.theme-dot{ width:17px; height:17px; border-radius:50%; cursor:pointer; border:2px solid transparent; transition:transform .18s, border-color .18s; box-shadow:inset 0 0 0 1px rgba(0,0,0,.18); }
.theme-dot:hover{ transform:scale(1.18); }
.theme-dot.on{ border-color:var(--text); transform:scale(1.12); }
.tabs{ display:flex; gap:6px; padding:5px; border-radius:14px; background:var(--card); border:1px solid var(--border); }
.tabs-right{ margin-left:auto; }
.tab{ padding:8px 16px; border-radius:10px; border:none; background:transparent; color:var(--text-2); font-size:16px; cursor:pointer; font-family:inherit; white-space:nowrap; transition:all .2s; }
.tab:hover{ color:var(--text); }
.tab.on{ background:var(--accent); color:#fff; font-weight:600; }
.search{ flex:0 1 220px; min-width:120px; padding:10px 16px; border-radius:12px; border:1px solid var(--border); background:var(--card); color:var(--text); font-size:16px; outline:none; font-family:inherit; transition:border-color .2s; }
.search:focus{ border-color:var(--accent); }
.search::placeholder{ color:var(--text-2); }
.topbar-row-2 .tabs{ padding:4px; border-radius:12px; }
.topbar-row-2 .tab{ padding:6px 14px; font-size:15px; border-radius:8px; }
.topbar-row-2 .search{ padding:8px 14px; font-size:15px; border-radius:10px; }
body.locked .btn-add, body.locked .btn-add-station, body.locked .btn-edit-st, body.locked .sort-wrap, body.locked .cactions{ opacity:.35; filter:grayscale(1); }
body.locked .btn-add, body.locked .btn-add-station, body.locked .btn-edit-st, body.locked .btn-sort, body.locked .cactions button{ cursor:not-allowed !important; }
body.locked .cactions button:hover{ color:var(--text-2) !important; background:transparent !important; transform:none !important; }
body.locked .cactions button{ position:relative; }
body.locked .cactions button::after{ content:'\f023'; font-family:'Font Awesome 5 Free',sans-serif; position:absolute; top:50%; left:50%; transform:translate(-50%,-50%); font-size:9px; opacity:.5; pointer-events:none; color:var(--text-2); }
body.locked .btn-add:hover, body.locked .btn-add-station:hover, body.locked .btn-edit-st:hover, body.locked .btn-sort:hover{ color:var(--text-2) !important; border-color:var(--border) !important; transform:none !important; box-shadow:none !important; }
body.locked .cactions{ display:none !important; }
body.locked .p-copy{ display:none !important; }
.wrap{ max-width:1200px; margin:0 auto; padding:calc(var(--topbar-h) + 24px) 20px 130px; }
.layout{ display:grid; grid-template-columns:minmax(0,1fr); gap:18px; align-items:stretch; }
.layout.with-side{ grid-template-columns:168px minmax(0,1fr); }
.main-col{ min-width:0; }
.quick-nav{ display:none; align-self:start; position:sticky; top:calc(var(--topbar-h) + 16px); max-height:calc(100vh - var(--topbar-h) - 150px); overflow-y:auto; overscroll-behavior:contain; padding:9px 8px; border-radius:16px; background:var(--card); border:1px solid var(--border); box-shadow:var(--shadow); z-index:30; }
.quick-nav.show{ display:block; }
.qn-title{ font-size:12px; color:var(--text-3); letter-spacing:1px; padding:2px 8px 8px; }
.qn-item{ display:flex; align-items:center; justify-content:space-between; gap:6px; width:100%; padding:7px 9px; margin:0 0 2px; border:none; border-radius:9px; background:transparent; color:var(--text-2); font-size:14px; font-family:inherit; cursor:pointer; text-align:left; transition:background .18s,color .18s; }
.qn-item:last-child{ margin-bottom:0; }
.qn-item:hover{ background:var(--accent-soft); color:var(--accent); }
.qn-item.on{ background:var(--accent); color:#fff; font-weight:600; }
.qn-item.on .qn-count{ opacity:.85; }
.qn-name{ overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.qn-count{ flex:none; font-size:11px; opacity:.6; font-variant-numeric:tabular-nums; }
.list-head{ display:flex; align-items:center; gap:10px; margin:0 0 14px; padding:0 4px; font-size:14px; color:var(--text-2); flex-wrap:wrap; }
.list-head-title{ flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.btn-add-station{ flex:none; font-size:14px; padding:5px 12px; border-radius:8px; border:1px dashed var(--border); background:transparent; color:var(--text-2); cursor:pointer; font-family:inherit; transition:all .2s; white-space:nowrap; }
.btn-add-station:hover{ color:var(--accent); border-color:var(--accent); }
.station{ background:var(--card); border:1px solid var(--border); border-radius:16px; padding:14px 16px; margin-bottom:14px; box-shadow:var(--shadow); transition:background .3s,border-color .3s; }
.station-head{ display:flex; align-items:center; gap:10px; margin-bottom:12px; flex-wrap:wrap; }
.tag{ font-size:13px; padding:3px 9px; border-radius:999px; white-space:nowrap; background:var(--accent-soft); color:var(--accent-2); border:1px solid var(--accent-soft); }
.station-head h3{ font-size:17px; margin:0; font-weight:600; }
.cnt{ font-size:14px; color:var(--text-2); }
.st-head-actions{ margin-left:auto; display:flex; align-items:center; gap:6px; flex:none; }
.btn-add{ font-size:14px; padding:5px 12px; border-radius:8px; border:1px dashed var(--border); background:transparent; color:var(--text-2); cursor:pointer; font-family:inherit; transition:all .2s; }
.btn-add:hover{ color:var(--accent); border-color:var(--accent); }
.btn-edit-st{ font-size:13px; padding:5px 10px; border-radius:8px; line-height:1; border:1px dashed var(--border); background:transparent; color:var(--text-2); cursor:pointer; font-family:inherit; transition:all .2s; }
.btn-edit-st:hover{ color:var(--accent); border-color:var(--accent); }
.sort-wrap{ position:relative; flex:none; }
.btn-sort{ font-size:13px; padding:5px 10px; border-radius:8px; line-height:1; border:1px dashed var(--border); background:transparent; color:var(--text-2); cursor:pointer; font-family:inherit; transition:all .2s; white-space:nowrap; }
.btn-sort:hover, .sort-wrap.open .btn-sort{ color:var(--accent); border-color:var(--accent); }
.sort-menu{ position:absolute; top:calc(100% + 6px); right:0; z-index:40; min-width:140px; padding:5px; border-radius:11px; background:var(--card); border:1px solid var(--border); box-shadow:var(--shadow); display:none; flex-direction:column; gap:2px; }
.sort-wrap.open .sort-menu{ display:flex; }
.sort-menu button{ text-align:left; width:100%; font-size:13px; padding:7px 10px; border:none; border-radius:7px; background:transparent; color:var(--text-2); cursor:pointer; font-family:inherit; white-space:nowrap; transition:all .15s; }
.sort-menu button:hover{ background:var(--accent-soft); color:var(--accent); }
.channels{ display:grid; grid-template-columns:repeat(auto-fill,minmax(220px,1fr)); gap:8px; }
.channel{ display:flex; align-items:center; gap:8px; padding:9px 10px; border-radius:10px; cursor:pointer; background:var(--card-2); border:1px solid transparent; transition:all .18s; outline:none; }
.channel:hover{ border-color:var(--accent); transform:translateY(-1px); }
.channel:focus-visible{ border-color:var(--accent); box-shadow:0 0 0 2px var(--accent-soft); }
.channel.active{ border-color:var(--accent); background:var(--accent-soft); }
.play-ico{ width:14px; flex:none; text-align:center; font-size:11px; color:var(--accent); display:flex; align-items:center; justify-content:center; }
.eq{ display:inline-flex; align-items:flex-end; gap:2px; height:12px; }
.eq i{ width:3px; border-radius:1px; background:var(--accent); transform-origin:bottom; animation:eqBar .9s ease-in-out infinite; }
.eq i:nth-child(1){ height:6px; animation-delay:0s; }
.eq i:nth-child(2){ height:12px; animation-delay:.2s; }
.eq i:nth-child(3){ height:8px; animation-delay:.4s; }
@keyframes eqBar{ 0%,100%{ transform:scaleY(.35); } 50%{ transform:scaleY(1); } }
.cname{ flex:1; min-width:0; display:flex; align-items:center; font-size:15px; }
.ctxt{ min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.bulb{ flex:none; width:8px; height:8px; border-radius:50%; margin-left:6px; background:#22c55e; box-shadow:0 0 6px rgba(34,197,94,.85); transition:background .25s, box-shadow .25s; }
.bulb.bad{ background:#ef4444; box-shadow:0 0 6px rgba(239,68,68,.85); }
.cactions{ display:flex; gap:2px; opacity:.65; transition:opacity .18s; flex:none; }
.channel:hover .cactions{ opacity:1; }
.cactions button{ position:relative; border:none; background:transparent; color:var(--text-2); cursor:pointer; font-size:14px; padding:2px 5px; border-radius:6px; font-family:inherit; transition:all .18s; }
.cactions button:hover{ color:var(--accent); background:var(--accent-soft); }
.empty{ text-align:center; padding:60px 20px; color:var(--text-2); font-size:16px; line-height:2; }
.empty small{ font-size:14px; opacity:.85; }
.btn-clear-search{ margin-top:4px; padding:6px 16px; border-radius:8px; border:1px solid var(--accent); background:var(--accent-soft); color:var(--accent); font-size:14px; font-family:inherit; cursor:pointer; transition:all .2s; }
.btn-clear-search:hover{ filter:brightness(1.1); transform:translateY(-1px); }
.player{ position:fixed; left:0; right:0; bottom:0; z-index:80; display:flex; align-items:center; gap:12px; padding:10px 18px; padding-bottom:calc(10px + env(safe-area-inset-bottom)); background:var(--glass); border-top:1px solid var(--border); box-shadow:0 -6px 24px rgba(0,0,0,.18); backdrop-filter:blur(16px); -webkit-backdrop-filter:blur(16px); }
.p-ico{ width:38px; height:38px; flex:none; border-radius:50%; display:flex; align-items:center; justify-content:center; background:var(--accent-soft); color:var(--accent); font-size:18px; }
.player.playing .p-ico{ animation:picoPulse 1.8s ease-in-out infinite; }
@keyframes picoPulse{ 0%,100%{ box-shadow:0 0 0 0 var(--accent-soft); } 50%{ box-shadow:0 0 0 7px transparent; } }
.p-text{ flex:1; min-width:0; }
.p-name{ font-size:16px; font-weight:600; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.p-sub{ display:flex; align-items:center; gap:9px; font-size:13px; color:var(--text-2); margin-top:2px; overflow:hidden; min-width:0; }
.p-sub-txt{ flex:0 1 auto; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.p-freq{ flex:none; white-space:nowrap; font-size:13px; font-weight:700; color:var(--accent); padding:1px 8px; border-radius:6px; background:var(--accent-soft); }
.p-freq.hide{ display:none; }
.p-url-row{ display:flex; align-items:center; gap:7px; margin-top:5px; min-width:0; }
.p-url-row.hide{ display:none; }
.p-url{ flex:1; min-width:0; font-size:12px; color:var(--text-2); font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.p-copy{ flex:none; width:24px; height:24px; padding:0; border-radius:7px; display:flex; align-items:center; justify-content:center; border:1px solid var(--border); background:var(--card-2); color:var(--text-2); cursor:pointer; transition:all .18s; }
.p-copy svg{ width:13px; height:13px; display:block; }
.p-copy:hover{ color:var(--accent); border-color:var(--accent); }
.p-copy:active{ transform:scale(.9); }
.p-copy.done{ color:#22c55e; border-color:#22c55e; }
.p-right{ display:flex; align-items:center; gap:12px; flex:none; }
#vol{ width:80px; accent-color:var(--accent); cursor:pointer; }
.p-play{ width:40px; height:40px; border-radius:50%; border:none; cursor:pointer; background:var(--accent); color:#fff; font-size:17px; display:flex; align-items:center; justify-content:center; transition:transform .15s, filter .2s; }
.p-play:hover{ transform:scale(1.06); filter:brightness(1.1); }
.p-url.editable, .p-freq.editable{ cursor:pointer; }
.p-url.editable:hover{ color:var(--accent); text-decoration:underline dotted; }
.p-freq.editable:hover{ filter:brightness(1.15); }
.p-url-input{ flex:1; min-width:0; padding:2px 8px; border-radius:7px; border:1px solid var(--accent); background:var(--card-2); color:var(--text); font-size:12px; outline:none; font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; }
.p-freq-input{ flex:0 0 auto; width:92px; padding:2px 8px; border-radius:6px; border:1px solid var(--accent); background:var(--card-2); color:var(--accent); font-size:13px; font-weight:700; outline:none; font-family:inherit; }
.p-url.hide, .p-freq.hide, .p-url-input.hide, .p-freq-input.hide, .p-copy.hide{ display:none !important; }
.to-top{ position:fixed; right:20px; bottom:100px; z-index:85; width:44px; height:44px; border-radius:50%; cursor:pointer; border:1px solid var(--border); background:var(--glass); color:var(--text); font-size:20px; box-shadow:var(--shadow); backdrop-filter:blur(14px); -webkit-backdrop-filter:blur(14px); opacity:0; pointer-events:none; transform:translateY(10px); transition:all .25s; }
.to-top.show{ opacity:1; pointer-events:auto; transform:translateY(0); }
.to-top:hover{ color:var(--accent); border-color:var(--accent); }
.modal-mask{ position:fixed; inset:0; z-index:200; display:none; align-items:center; justify-content:center; padding:20px; background:rgba(0,0,0,.55); backdrop-filter:blur(3px); }
.modal-mask.show{ display:flex; }
.modal{ width:100%; max-width:420px; max-height:88vh; overflow-y:auto; padding:22px; border-radius:18px; background:var(--card); border:1px solid var(--border); box-shadow:var(--shadow); animation:pop .2s ease; }
@keyframes pop{ from{ transform:scale(.94); opacity:0; } to{ transform:scale(1); opacity:1; } }
.modal h3{ margin:0 0 18px; font-size:18px; }
.modal label{ display:block; font-size:14px; color:var(--text-2); margin-bottom:14px; }
.modal input, .modal textarea, .modal select{ width:100%; margin-top:6px; padding:10px 13px; border-radius:10px; border:1px solid var(--border); background:var(--card-2); color:var(--text); font-size:16px; outline:none; font-family:inherit; transition:border-color .2s; }
.modal textarea{ resize:vertical; min-height:58px; line-height:1.5; }
.modal select{ cursor:pointer; }
.modal input:focus, .modal textarea:focus, .modal select:focus{ border-color:var(--accent); }
.modal input::placeholder, .modal textarea::placeholder{ color:var(--text-2); }
.modal-btns{ display:flex; gap:10px; justify-content:flex-end; margin-top:6px; }
.modal-btns button{ padding:9px 20px; border-radius:10px; border:none; cursor:pointer; font-size:16px; font-family:inherit; transition:all .2s; }
#mCancel, #sCancel{ background:var(--card-2); color:var(--text-2); border:1px solid var(--border); }
#mCancel:hover, #sCancel:hover{ color:var(--text); }
#mOk, #sOk{ background:var(--accent); color:#fff; font-weight:600; }
#mOk:hover, #sOk:hover{ filter:brightness(1.1); }
#mDel, #sDel{ margin-right:auto; background:transparent; color:#e0364b; border:1px solid rgba(224,54,75,.45); }
#mDel:hover, #sDel:hover{ background:rgba(224,54,75,.12); }
#mDel.hide, #sDel.hide{ display:none; }
.toast{ position:fixed; left:50%; bottom:130px; z-index:300; transform:translateX(-50%) translateY(12px); padding:10px 20px; border-radius:999px; font-size:15px; max-width:90vw; background:var(--card); color:var(--text); border:1px solid var(--border); box-shadow:var(--shadow); opacity:0; pointer-events:none; transition:all .25s; text-align:center; }

const CAT_LABEL = { 'XG':'香港', 'AM':'澳门', 'TW':'台湾', 'HW':'海外' };
const catLabel  = c => CAT_LABEL[c] || c;

let idSeq = 1;
const nid = () => 'c' + (idSeq++) + '_' + Math.random().toString(36).slice(2, 7);
const esc = s => String(s).replace(/[&<>"']/g, m => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[m]));

function normalize(arr) {
  arr.forEach(s => {
    if (!s.id) s.id = nid();
    if (typeof s.cat !== 'string' || !s.cat) s.cat = '网络电台';
    if (typeof s.province !== 'string') s.province = '';
    if (typeof s.station !== 'string') s.station = '';
    if (!Array.isArray(s.channels)) s.channels = [];
    s.channels.forEach(c => {
      if (!c.id) c.id = nid();
      if (typeof c.name !== 'string') c.name = '';
      if (typeof c.url  !== 'string') c.url  = '';
      if (typeof c.freq !== 'string') c.freq = '';
      if (typeof c.desc !== 'string') c.desc = '';
    });
  });
  return arr;
}

/* 载入：版本一致用本地，否则用内嵌"出厂数据" */
function loadStations() {
  let raw = null, savedVer = null;
  try {
    raw = localStorage.getItem(STORAGE_KEY);
    savedVer = localStorage.getItem(VER_KEY);
  } catch (e) {}
  if (raw && savedVer === EMBEDDED_VER) {
    try {
      const arr = JSON.parse(raw);
      if (Array.isArray(arr) && arr.length) return normalize(arr);
    } catch (e) {}
  }
  const arr = normalize(JSON.parse(JSON.stringify(EMBEDDED_DATA)));
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(arr));
    localStorage.setItem(VER_KEY, EMBEDDED_VER);
  } catch (e) {}
  return arr;
}
function persist() {
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(stations));
    localStorage.setItem(VER_KEY, EMBEDDED_VER);
  } catch (e) {}
}

/* HLS 播放支持 */
let hls = null;
function destroyHls() {
  if (hls) { try { hls.destroy(); } catch(e) {} hls = null; }
}
function playUrl(url) {
  destroyHls();
  audio.removeAttribute('src');
  audio.load();

  const isM3u8 = /\.m3u8(\?|$)/i.test(url);
  if (isM3u8 && window.Hls && Hls.isSupported()) {
    hls = new Hls({ liveSyncDurationCount: 3, enableWorker: true });
    hls.loadSource(url);
    hls.attachMedia(audio);
    hls.on(Hls.Events.MANIFEST_PARSED, () => {
      audio.play().catch(() => {});
    });
    hls.on(Hls.Events.ERROR, (evt, data) => {
      if (data.fatal) {
        if (activeUrl) setBulbState(activeUrl, true);
        playing = false;
        updatePlayerUI();
        refreshActive();
        toast('音频加载失败，请检查流地址');
      }
    });
  } else {
    audio.src = url;
    audio.play().catch(() => {});
  }
}

/* =========================================================
   八、流地址灯泡
   ========================================================= */
function bulbHtml(url) {
  const bad = badUrls.has(url);
  return `<i class="bulb${bad ? ' bad' : ''}" title="${bad ? '流地址可能已失效' : '流地址有效'}"></i>`;
}
function refreshBulbs(url) {
  const bad = badUrls.has(url);
  const ids = new Set();
  for (const s of stations) for (const c of s.channels) if (c.url === url) ids.add(c.id);
  if (!ids.size) return;
  document.querySelectorAll('.channel').forEach(el => {
    if (!ids.has(el.dataset.cid)) return;
    const bulb = el.querySelector('.bulb');
    if (!bulb) return;
    bulb.classList.toggle('bad', bad);
    bulb.title = bad ? '流地址可能已失效' : '流地址有效';
  });
}
function setBulbState(url, bad) {
  if (!url) return;
  const changed = bad ? !badUrls.has(url) : badUrls.has(url);
  if (!changed) return;
  if (bad) badUrls.add(url); else badUrls.delete(url);
  refreshBulbs(url);
}
function syncChannelBulb(ch) {
  const el = document.querySelector('.channel[data-cid="' + ch.id + '"]');
  if (!el) return;
  const cname = el.querySelector('.cname');
  if (!cname) return;
  let bulb = cname.querySelector('.bulb');
  const url = (ch.url || '').trim();
  if (!url) { if (bulb) bulb.remove(); return; }
  if (!bulb) { bulb = document.createElement('i'); bulb.className = 'bulb'; cname.appendChild(bulb); }
  const bad = badUrls.has(url);
  bulb.classList.toggle('bad', bad);
  bulb.title = bad ? '流地址可能已失效' : '流地址有效';
}

/* =========================================================
   九、频道排序
   ========================================================= */
const SORT_LABEL = { 'name-asc':'名称 A→Z','name-desc':'名称 Z→A','freq-asc':'频率 低→高','freq-desc':'频率 高→低' };
const zhCollator = new Intl.Collator('zh-Hans-CN', { numeric: true, sensitivity: 'base' });
function freqNum(str) {
  const m = String(str || '').match(/\d+(?:\.\d+)?/);
  return m ? parseFloat(m[0]) : null;
}
function closeSortMenus() {
  document.querySelectorAll('.sort-wrap.open').forEach(el => el.classList.remove('open'));
}
function applySort(station, mode) {
  if (!station) return;
  if (!station.channels.length) { toast('该电台暂无频道'); return; }
  if (!SORT_LABEL[mode]) return;
  const sign = (mode === 'name-desc' || mode === 'freq-desc') ? -1 : 1;
  station.channels.sort((a, b) => {
    if (mode === 'name-asc' || mode === 'name-desc') return sign * zhCollator.compare(a.name || '', b.name || '');
    const fa = freqNum(a.freq), fb = freqNum(b.freq);
    if (fa === null && fb === null) return zhCollator.compare(a.name || '', b.name || '');
    if (fa === null) return 1;
    if (fb === null) return -1;
    if (fa !== fb) return sign * (fa - fb);
    return zhCollator.compare(a.name || '', b.name || '');
  });
  persist();
  render();
  toast('已按「' + SORT_LABEL[mode] + '」排序');
}

function renderQuickNav(groups) {
  qnGroups = groups || [];
  const show = editLocked
    && QUICK_NAV_CATS.indexOf(currentCat) !== -1
    && qnGroups.length > 1;
  $quickNav.classList.toggle('show', show);
  if ($layout) $layout.classList.toggle('with-side', show);
  if (!show) { $quickNav.innerHTML = ''; return; }
  $quickNav.innerHTML =
    '<div class="qn-title">快速定位</div>' +
    qnGroups.map(g =>
      '<button class="qn-item" data-prov="' + esc(g.province) + '" data-sid="' + esc(g.sid) + '" title="跳转到 ' + esc(g.province) + '">' +
        '<span class="qn-name">' + esc(g.province) + '</span>' +
        '<span class="qn-count">' + g.count + '</span>' +
      '</button>'
    ).join('');
}

function updateQnActive() {
  if (!$quickNav.classList.contains('show')) return;
  if (Date.now() < qnLockUntil) return;
  const topbar = document.querySelector('.topbar');
  const th = (topbar ? topbar.getBoundingClientRect().height : 0) + 30;
  const els = $list.querySelectorAll('.station');
  let activeSid = null;
  for (const el of els) {
    if (el.getBoundingClientRect().top <= th) activeSid = el.dataset.sid;
    else break;
  }
  if (!activeSid && els.length) activeSid = els[0].dataset.sid;
  if (!activeSid) return;
  const st = stations.find(s => s.id === activeSid);
  const prov = st ? ((st.province || '').trim() || catLabel(st.cat)) : null;
  $quickNav.querySelectorAll('.qn-item').forEach(b => {
    b.classList.toggle('on', b.dataset.prov === prov);
  });
}

$quickNav.addEventListener('click', e => {
  const btn = e.target.closest('.qn-item');
  if (!btn) return;
  const el = $list.querySelector('.station[data-sid="' + btn.dataset.sid + '"]');
  if (!el) return;
  const topbar = document.querySelector('.topbar');
  const th = topbar ? topbar.getBoundingClientRect().height : 0;
  const y = el.getBoundingClientRect().top + window.scrollY - th - 14;
  qnLockUntil = Date.now() + 700;
  $quickNav.querySelectorAll('.qn-item').forEach(b => b.classList.toggle('on', b === btn));
  window.scrollTo({ top: Math.max(0, y), behavior: 'smooth' });
});

let qnScrollTicking = false;
window.addEventListener('scroll', () => {
  if (qnScrollTicking) return;
  qnScrollTicking = true;
  requestAnimationFrame(() => {
    qnScrollTicking = false;
    updateQnActive();
  });
}, { passive: true });

/* =========================================================
   十、列表渲染
   ========================================================= */
function playIcoHtml(active) {
  return active && playing ? '<span class="eq"><i></i><i></i><i></i></span>' : '▶';
}
function render() {
  const q = keyword.trim().toLowerCase();
  const pool = stations.filter(s => s.cat === currentCat);
  let html = '';
  let stationCount = 0;
  let channelCount = 0;
  const navGroups = [];
  const navMap = new Map();

  for (const s of pool) {
    const matched = s.channels.filter(c =>
      !q ||
      (c.name || '').toLowerCase().includes(q) ||
      (c.freq || '').toLowerCase().includes(q) ||
      (c.desc || '').toLowerCase().includes(q) ||
      (s.station || '').toLowerCase().includes(q) ||
      (s.province || '').toLowerCase().includes(q)
    );
    if (q && matched.length === 0) continue;
    stationCount++;
    channelCount += matched.length;

    /* 收集省份快捷导航分组 */
    const prov = (s.province || '').trim() || catLabel(s.cat);
    let grp = navMap.get(prov);
    if (!grp) {
      grp = { province: prov, count: 0, sid: s.id };
      navMap.set(prov, grp);
      navGroups.push(grp);
    }
    grp.count += matched.length;

    html += `
      <section class="station" data-sid="${esc(s.id)}">
        <div class="station-head">
          <span class="tag">${esc(catLabel(s.province || s.cat))}</span>
          <h3>${esc(s.station)}</h3>
          <span class="cnt">${s.channels.length} 个频率</span>
          <div class="st-head-actions">
            <div class="sort-wrap">
              <button class="btn-sort" data-act="sort-toggle" title="频道排序">⇅ 排序</button>
              <div class="sort-menu">
                <button data-act="sort" data-sort="name-asc">名称 A→Z</button>
                <button data-act="sort" data-sort="name-desc">名称 Z→A</button>
                <button data-act="sort" data-sort="freq-asc">频率 低→高</button>
                <button data-act="sort" data-sort="freq-desc">频率 高→低</button>
              </div>
            </div>
            <button class="btn-edit-st" data-act="edit-station" title="编辑电台名称 / 标签">✎ 编辑电台</button>
            <button class="btn-add" data-act="add">＋ 添加频道</button>
          </div>
        </div>
        <div class="channels">
          ${matched.length ? matched.map(c => {
            const active = c.id === currentId;
            return `
            <div class="channel${active ? ' active' : ''}" data-cid="${esc(c.id)}" role="button" tabindex="0" aria-label="${esc(c.name)}">
              <span class="play-ico">${playIcoHtml(active)}</span>
              <span class="cname"><span class="ctxt">${esc(c.name)}</span>${c.url ? bulbHtml(c.url) : ''}</span>
              <span class="cactions"><button data-act="edit" title="编辑">✎</button></span>
            </div>`;
          }).join('') : `<div style="grid-column:1/-1;font-size:14px;color:var(--text-2);padding:4px 2px;">该电台下暂无频道，点击右上角「＋ 添加频道」</div>`}
        </div>
      </section>`;
  }

  const head = `
    <div class="list-head">
      <span class="list-head-title">${esc(catLabel(currentCat))} · 共 ${stationCount} 个电台 · ${channelCount} 个广播频率</span>
      <button class="btn-add-station" data-add-station>＋ 添加电台</button>
    </div>`;

  if (!html) {
    html = q
      ? `<div class="empty">未找到匹配的电台或频道<small><br>试试切换上方分类，或更换关键词<br><br><button type="button" class="btn-clear-search">✕ 清除搜索</button></small></div>`
      : `<div class="empty">该板块暂无电台<small><br>点击上方「＋ 添加电台」开始添加</small></div>`;
  }
  $list.innerHTML = head + html;

  renderQuickNav(navGroups);
  updateQnActive();
}

/* =========================================================
   十一、列表交互
   ========================================================= */
$list.addEventListener('click', e => {
  if (e.target.closest('.btn-clear-search')) {
    keyword = '';
    $search.value = '';
    render();
    return;
  }
  const sortToggle = e.target.closest('[data-act="sort-toggle"]');
  if (sortToggle) {
    if (editLocked) { toast('编辑已锁定，请点击右上角 🔒 解锁'); return; }
    const wrap = sortToggle.closest('.sort-wrap');
    const wasOpen = wrap.classList.contains('open');
    closeSortMenus();
    if (!wasOpen) wrap.classList.add('open');
    return;
  }
  const sortOpt = e.target.closest('[data-act="sort"]');
  if (sortOpt) {
    const stEl = sortOpt.closest('.station');
    const st = stEl && stations.find(s => s.id === stEl.dataset.sid);
    if (st) applySort(st, sortOpt.dataset.sort);
    closeSortMenus();
    return;
  }
  if (e.target.closest('[data-add-station]')) { openStationModal('add', null); return; }
  const stationEl = e.target.closest('.station');
  if (!stationEl) return;
  const station = stations.find(s => s.id === stationEl.dataset.sid);
  if (!station) return;
  const actBtn = e.target.closest('[data-act]');
  if (actBtn) {
    const act = actBtn.dataset.act;
    if (act === 'add') { openModal('add', station, null); return; }
    if (act === 'edit-station') { openStationModal('edit', station); return; }
    const chEl = e.target.closest('.channel');
    if (!chEl) return;
    const ch = station.channels.find(c => c.id === chEl.dataset.cid);
    if (!ch) return;
    if (act === 'edit') {
      if (editLocked) { toast('编辑已锁定，请点击右上角图标解锁'); return; }
      openModal('edit', station, ch);
      return;
    }
  }
  const chEl = e.target.closest('.channel');
  if (chEl) {
    const ch = station.channels.find(c => c.id === chEl.dataset.cid);
    if (ch) playChannel(station, ch);
  }
});
document.addEventListener('click', e => { if (!e.target.closest('.sort-wrap')) closeSortMenus(); });
$list.addEventListener('keydown', e => {
  if (e.key !== 'Enter' && e.key !== ' ' && e.key !== 'Spacebar') return;
  const chEl = e.target.closest('.channel');
  if (!chEl || e.target !== chEl) return;
  e.preventDefault();
  chEl.click();
});

let stModalCtx = null;
function openStationModal(mode, station) {
  if (editLocked) { toast('编辑已锁定，请点击右上角图标解锁编辑模式'); return; }
  closeStationModal();
  const editing = (mode === 'edit') && !!station;
  stModalCtx = { mode: editing ? 'edit' : 'add', station: editing ? station : null };
  document.getElementById('stModalTitle').textContent = editing ? '编辑电台' : '添加电台';
  $sProvince.value = editing ? (station ? station.province : currentCat) : currentCat;
  $sStation.value  = editing ? (station ? station.station : '') : '';
  $sDel.classList.toggle('hide', !editing);
  $stModal.classList.add('show');
  setTimeout(() => $sStation.focus(), 60);
}
function closeStationModal() { $stModal.classList.remove('show'); stModalCtx = null; }
function saveStationModal() {
  const province = $sProvince.value.trim() || currentCat;
  const station  = $sStation.value.trim();
  if (!station) { toast('请填写电台名称'); return; }
  if (stModalCtx && stModalCtx.mode === 'edit' && stModalCtx.station) {
    const t = stModalCtx.station;
    t.province = province; t.station = station;
    persist(); closeStationModal(); render(); updatePlayerUI(); toast('已保存电台'); return;
  }
  stations.push({ id: nid(), cat: currentCat, province, station, channels: [] });
  persist(); closeStationModal(); render(); toast('已添加电台');
}
function deleteStationModal() {
  if (!stModalCtx || stModalCtx.mode !== 'edit' || !stModalCtx.station) return;
  const t = stModalCtx.station;
  const n = t.channels.length;
  const msg = n ? '确定删除电台「' + t.station + '」及其下 ' + n + ' 个频道吗？' : '确定删除电台「' + t.station + '」吗？';
  if (!confirm(msg)) return;
  const playingHere = currentStation === t;
  if (playingHere) {
    audio.pause(); audio.removeAttribute('src');
    currentId = null; currentStation = null; currentChannel = null; playing = false;
    clearLast();
  }
  stations = stations.filter(s => s.id !== t.id);
  persist(); closeStationModal(); render();
  if (playingHere) updatePlayerUI();
  toast('已删除电台');
}
document.getElementById('sOk').addEventListener('click', saveStationModal);
document.getElementById('sCancel').addEventListener('click', closeStationModal);
$sDel.addEventListener('click', deleteStationModal);
$stModal.addEventListener('click', e => { if (e.target === $stModal) closeStationModal(); });

/* =========================================================
   十三、播放
   ========================================================= */
function rememberLast(id) { try { localStorage.setItem(LAST_KEY, id); } catch (e) {} }
function clearLast()      { try { localStorage.removeItem(LAST_KEY); } catch (e) {} }
function playChannel(station, ch) {
  if (currentId === ch.id && audio.src) {
    if (audio.paused) audio.play().catch(() => {}); else audio.pause();
    return;
  }
  if (!ch.url) {
    if (editLocked) toast('该频道尚未设置流地址，请先解锁编辑');
    else { toast('该频道尚未设置流地址，请点击 ✎ 填写'); openModal('edit', station, ch); }
    return;
  }
  currentId = ch.id;
  currentStation = station;
  currentChannel = ch;
  rememberLast(ch.id);
  activeUrl = ch.url;
  playUrl(ch.url);
  toast('正在播放：' + ch.name);
  updatePlayerUI();
  refreshActive();
}
audio.addEventListener('play',  () => { playing = true;  updatePlayerUI(); refreshActive(); });
audio.addEventListener('pause', () => { playing = false; updatePlayerUI(); refreshActive(); });
audio.addEventListener('playing', () => { if (activeUrl) setBulbState(activeUrl, false); });
audio.addEventListener('error', () => {
  if (!audio.getAttribute('src')) return;
  if (activeUrl) setBulbState(activeUrl, true);
  playing = false;
  updatePlayerUI();
  refreshActive();
  toast('音频加载失败，请检查流地址');
});
function refreshActive() {
  document.querySelectorAll('.channel').forEach(el => {
    const active = el.dataset.cid === currentId;
    el.classList.toggle('active', active);
    const ico = el.querySelector('.play-ico');
    if (ico) ico.innerHTML = playIcoHtml(active);
  });
}

/* =========================================================
   十四、播放器 UI
   ========================================================= */
function updatePlayerUI() {
  const url = currentChannel ? (currentChannel.url || '').trim() : '';
  if (currentChannel) {
    $pName.textContent = currentChannel.name;
    $pSub.textContent  = (currentStation.station || '') + ' · ' + (currentStation.province || currentStation.cat);
    const freq = (currentChannel.freq || '').trim();
    if (!freqEditing) {
      if (editLocked) {
        $pFreq.textContent = freq;
        $pFreq.classList.toggle('hide', !freq);
        $pFreq.classList.remove('editable');
        $pFreq.title = '';
      } else {
        $pFreq.textContent = freq || '＋ 频率';
        $pFreq.classList.remove('hide');
        $pFreq.classList.add('editable');
        $pFreq.title = '点击修改频率';
      }
    }
    $pPlay.textContent = playing ? '❚❚' : '▶';
  } else {
    $pName.textContent = '未选择频道';
    $pSub.textContent  = '点击任意频道开始收听';
    $pFreq.textContent = '';
    $pFreq.classList.add('hide');
    $pFreq.classList.remove('editable');
    $pFreq.title = '';
    $pPlay.textContent = '▶';
  }
  $player.classList.toggle('playing', !!currentChannel && playing);
  if (!urlEditing) {
    const canEdit    = !editLocked && !!currentChannel;
    const showUrlRow = !!currentChannel && (!!url || canEdit);
    $pUrl.textContent = url || (canEdit ? '点击设置流地址' : '');
    $pUrl.title       = url;
    $pUrl.classList.toggle('editable', canEdit);
    $pUrlRow.classList.toggle('hide', !showUrlRow);
  }
  $pCopy.classList.remove('done');
}

/* =========================================================
   十五、播放器内联编辑：流地址 / 频率
   ========================================================= */
function startUrlEdit() {
  if (editLocked) { toast('编辑已锁定，请先解锁'); return; }
  if (!currentChannel) { toast('请先选择一个频道'); return; }
  if (urlEditing) return;
  if (freqEditing) finishFreqEdit(true);
  urlEditing = true;
  $pUrlInput.value = currentChannel.url || '';
  $pUrl.classList.add('hide');
  $pCopy.classList.add('hide');
  $pUrlInput.classList.remove('hide');
  $pUrlInput.focus();
  $pUrlInput.select();
}
function finishUrlEdit(save) {
  if (!urlEditing) return;
  urlEditing = false;
  $pUrlInput.classList.add('hide');
  $pUrl.classList.remove('hide');
  $pCopy.classList.remove('hide');
  if (!currentChannel || !save) { updatePlayerUI(); return; }
  const v = $pUrlInput.value.trim();
  if (v && !/^https?:\/\//i.test(v)) { toast('流地址需以 http:// 或 https:// 开头'); updatePlayerUI(); return; }
  const old = (currentChannel.url || '').trim();
  if (v === old) { updatePlayerUI(); return; }
  const wasPlaying = playing;
  currentChannel.url = v;
  if (!v) { destroyHls(); audio.pause(); audio.removeAttribute('src'); activeUrl = null; playing = false; }
  else { activeUrl = v; if (wasPlaying) playUrl(v); }
  persist();
  syncChannelBulb(currentChannel);
  updatePlayerUI();
  refreshActive();
  toast(v ? '流地址已更新' : '已清除流地址');
}
function startFreqEdit() {
  if (editLocked) { toast('编辑已锁定，请先解锁'); return; }
  if (!currentChannel) { toast('请先选择一个频道'); return; }
  if (freqEditing) return;
  if (urlEditing) finishUrlEdit(true);
  freqEditing = true;
  $pFreqInput.value = currentChannel.freq || '';
  $pFreq.classList.add('hide');
  $pFreqInput.classList.remove('hide');
  $pFreqInput.focus();
  $pFreqInput.select();
}
function finishFreqEdit(save) {
  if (!freqEditing) return;
  freqEditing = false;
  $pFreqInput.classList.add('hide');
  $pFreq.classList.remove('hide');
  if (!currentChannel || !save) { updatePlayerUI(); return; }
  const v = $pFreqInput.value.trim();
  const old = (currentChannel.freq || '').trim();
  if (v === old) { updatePlayerUI(); return; }
  currentChannel.freq = v;
  persist();
  updatePlayerUI();
  toast(v ? '频率已更新' : '已清除频率');
}
$pUrl.addEventListener('click', startUrlEdit);
$pFreq.addEventListener('click', startFreqEdit);
$pUrlInput.addEventListener('keydown', e => {
  if (e.key === 'Enter')  { e.preventDefault(); finishUrlEdit(true); }
  else if (e.key === 'Escape') { e.preventDefault(); finishUrlEdit(false); }
});
$pUrlInput.addEventListener('blur', () => finishUrlEdit(true));
$pFreqInput.addEventListener('keydown', e => {
  if (e.key === 'Enter')  { e.preventDefault(); finishFreqEdit(true); }
  else if (e.key === 'Escape') { e.preventDefault(); finishFreqEdit(false); }
});
$pFreqInput.addEventListener('blur', () => finishFreqEdit(true));
$pPlay.addEventListener('click', () => {
  if (!currentChannel) { toast('请先选择一个频道'); return; }
  if (!audio.src) { toast('请先设置该频道的流地址'); return; }
  if (audio.paused) audio.play().catch(() => toast('播放失败')); else audio.pause();
});
$vol.addEventListener('input', e => { audio.volume = parseFloat(e.target.value); });

/* =========================================================
   十六、复制流地址
   ========================================================= */
function fallbackCopy(text, done) {
  try {
    const ta = document.createElement('textarea');
    ta.value = text;
    ta.setAttribute('readonly', '');
    ta.style.position = 'fixed';
    ta.style.top = '-9999px';
    ta.style.opacity = '0';
    document.body.appendChild(ta);
    ta.select();
    ta.setSelectionRange(0, ta.value.length);
    document.execCommand('copy');
    document.body.removeChild(ta);
    done();
  } catch (e) { toast('复制失败，请手动复制'); }
}
function copyText(text) {
  const done = () => {
    toast('已复制流地址');
    $pCopy.classList.add('done');
    setTimeout(() => $pCopy.classList.remove('done'), 1200);
  };
  if (navigator.clipboard && window.isSecureContext) {
    navigator.clipboard.writeText(text).then(done).catch(() => fallbackCopy(text, done));
  } else {
    fallbackCopy(text, done);
  }
}
$pCopy.addEventListener('click', () => {
  const url = currentChannel ? (currentChannel.url || '').trim() : '';
  if (!url) { toast('暂无流地址'); return; }
  copyText(url);
});

/* =========================================================
   十七、编辑频道弹窗
   ========================================================= */
function fillStationSelect(selectedId) {
  const sel = $mStation;
  sel.innerHTML = '';
  const cats = [];
  stations.forEach(s => { if (cats.indexOf(s.cat) === -1) cats.push(s.cat); });
  for (const cat of cats) {
    const pool = stations.filter(s => s.cat === cat);
    if (!pool.length) continue;
    const og = document.createElement('optgroup');
    og.label = catLabel(cat);
    for (const s of pool) {
      const opt = document.createElement('option');
      opt.value = s.id;
      opt.textContent = (s.province ? catLabel(s.province) + ' · ' : '') + s.station;
      og.appendChild(opt);
    }
    sel.appendChild(og);
  }
  if (selectedId) sel.value = selectedId;
}
function openModal(mode, station, channel) {
  if (editLocked) { toast('编辑已锁定，请点击右上角图标解锁编辑模式'); return; }
  closeModal();
  modalCtx = { mode, station, channel };
  const editing = mode === 'edit';
  document.getElementById('modalTitle').textContent = editing ? '编辑频道' : '添加频道';
  $mName.value = editing ? (channel ? channel.name : '') : '';
  $mFreq.value = editing ? (channel ? (channel.freq || '') : '') : '';
  if (!$mFreq.value.trim()) $mFreq.value = 'FM ';
  $mDesc.value = editing ? (channel ? (channel.desc || '') : '') : '';
  $mUrl.value  = editing ? (channel ? (channel.url || '') : '') : '';
  $mStationWrap.style.display = editing ? '' : 'none';
  if (editing && station) fillStationSelect(station.id);
  $mDel.classList.toggle('hide', !editing);
  $modal.classList.add('show');
  setTimeout(() => $mName.focus(), 60);
}
function closeModal() { $modal.classList.remove('show'); modalCtx = null; }
function saveModal() {
  if (!modalCtx) return;
  const name = $mName.value.trim();
  let freq = $mFreq.value.trim();
  if (/^FM$/i.test(freq)) freq = '';
  const desc = $mDesc.value.trim();
  const url  = $mUrl.value.trim();
  if (!name) { toast('请填写频道名称'); return; }
  if (url && !/^https?:\/\//i.test(url)) { toast('流地址需以 http:// 或 https:// 开头'); return; }
  const { mode, station, channel } = modalCtx;
  if (mode === 'edit') {
    const oldUrl = channel.url;
    channel.name = name;
    channel.freq = freq;
    channel.desc = desc;
    channel.url  = url;
    if (oldUrl !== url) badUrls.delete(url);
    const targetId = $mStation.value;
    if (targetId && targetId !== station.id) {
      const target = stations.find(s => s.id === targetId);
      if (target) {
        station.channels = station.channels.filter(c => c.id !== channel.id);
        target.channels.push(channel);
        if (currentChannel === channel) currentStation = target;
        toast('已保存，频道已移动至「' + target.station + '」');
      } else { toast('已保存'); }
    } else { toast('已保存'); }
    if (currentChannel === channel) updatePlayerUI();
  } else {
    station.channels.push({ id: nid(), name, freq, desc, url });
    toast('已添加频道');
  }
  persist();
  closeModal();
  render();
}
$mFreq.addEventListener('input', () => {
  const v = $mFreq.value;
  if (!/^FM\s/i.test(v)) {
    const rest = v.replace(/^\s*FM\s*/i, '');
    $mFreq.value = 'FM ' + rest;
    const pos = $mFreq.value.length;
    try { $mFreq.setSelectionRange(pos, pos); } catch (e) {}
  }
});
$mFreq.addEventListener('focus', () => {
  if ($mFreq.value === 'FM ') {
    setTimeout(() => {
      const pos = $mFreq.value.length;
      try { $mFreq.setSelectionRange(pos, pos); } catch (e) {}
    }, 0);
  }
});
$mDel.addEventListener('click', () => {
  if (!modalCtx || modalCtx.mode !== 'edit') return;
  const { station, channel } = modalCtx;
  if (!confirm('确定删除频道「' + channel.name + '」吗？')) return;
  station.channels = station.channels.filter(c => c.id !== channel.id);
  if (currentId === channel.id) {
    audio.pause(); audio.removeAttribute('src');
    currentId = null; currentStation = null; currentChannel = null; playing = false;
    clearLast();
    updatePlayerUI();
  }
  persist(); closeModal(); render(); toast('已删除频道');
});
document.getElementById('mOk').addEventListener('click', saveModal);
document.getElementById('mCancel').addEventListener('click', closeModal);
$modal.addEventListener('click', e => { if (e.target === $modal) closeModal(); });
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') closeSortMenus();
  if ($stModal.classList.contains('show')) {
    if (e.key === 'Escape') closeStationModal();
    if (e.key === 'Enter') saveStationModal();
    return;
  }
  if (!$modal.classList.contains('show')) return;
  if (e.key === 'Escape') closeModal();
  if (e.key === 'Enter' && e.target.tagName !== 'TEXTAREA') saveModal();
});

/* =========================================================
   十八、搜索
   ========================================================= */
let searchTimer = null;
$search.addEventListener('input', e => {
  keyword = e.target.value;
  clearTimeout(searchTimer);
  searchTimer = setTimeout(render, 160);
});
$search.addEventListener('keydown', e => {
  if (e.key === 'Escape') { e.target.value = ''; keyword = ''; render(); }
});

/* =========================================================
   十九、回到顶部
   ========================================================= */
window.addEventListener('scroll', () => { $toTop.classList.toggle('show', window.scrollY > 280); }, { passive: true });
$toTop.addEventListener('click', () => window.scrollTo({ top: 0, behavior: 'smooth' }));

/* =========================================================
   二十、提示条
   ========================================================= */
let toastTimer = null;
function toast(msg) {
  $toast.textContent = msg;
  $toast.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => $toast.classList.remove('show'), 2200);
}

/* =========================================================
   二十一、顶栏高度同步
   ========================================================= */
function updateTopbarHeight() {
  const topbar = document.querySelector('.topbar');
  if (!topbar) return;
  const h = topbar.getBoundingClientRect().height;
  document.documentElement.style.setProperty('--topbar-h', h + 'px');
}
window.addEventListener('resize', updateTopbarHeight, { passive: true });
if (window.ResizeObserver) {
  try { new ResizeObserver(updateTopbarHeight).observe(document.querySelector('.topbar')); } catch (e) {}
}

/* =========================================================
   二十二、恢复上次播放的频道
   ========================================================= */
function restoreLast() {
  let lastId = null;
  try { lastId = localStorage.getItem(LAST_KEY); } catch (e) {}
  if (!lastId) return;
  for (const s of stations) {
    const ch = s.channels.find(c => c.id === lastId);
    if (ch) { currentId = ch.id; currentStation = s; currentChannel = ch; return; }
  }
  clearLast();
}

/* =========================================================
   二十三、自动定位 + 自动播放
   ========================================================= */
function scrollToActiveCard() {
  if (!currentId) return;
  const chEl = document.querySelector('.channel[data-cid="' + currentId + '"]');
  if (!chEl) return;
  const stEl = chEl.closest('.station') || chEl;
  const topbar = document.querySelector('.topbar');
  const th = topbar ? topbar.getBoundingClientRect().height : 0;
  const rect = stEl.getBoundingClientRect();
  const y = rect.top + window.scrollY - th - 12;
  window.scrollTo({ top: Math.max(0, y), behavior: 'auto' });
}
let autoResumeBound = false;
function setupFirstInteractionResume() {
  if (autoResumeBound) return;
  autoResumeBound = true;
  toast('浏览器已阻止自动播放，点击任意处继续收听');
  const resume = () => {
    document.removeEventListener('pointerdown', resume, true);
    document.removeEventListener('keydown', resume, true);
    document.removeEventListener('touchstart', resume, true);
    autoResumeBound = false;
    if (audio.getAttribute('src')) audio.play().catch(() => {});
  };
  document.addEventListener('pointerdown', resume, true);
  document.addEventListener('keydown', resume, true);
  document.addEventListener('touchstart', resume, true);
}
function autoPlayLast() {
  if (!currentChannel) return;
  const url = (currentChannel.url || '').trim();
  if (!url) return;
  activeUrl = url;
  playUrl(url);
  // 浏览器自动播放策略：首次交互后恢复
  if (audio.paused) setupFirstInteractionResume();
}

/* =========================================================
   二十四、键盘快捷键：空格播放/暂停
   ========================================================= */
document.addEventListener('keydown', e => {
  const tag = document.activeElement && document.activeElement.tagName;
  if (tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT') return;
  if (e.code === 'Space' && currentChannel) {
    e.preventDefault();
    if (!audio.src) { toast('请先设置该频道的流地址'); return; }
    if (audio.paused) audio.play().catch(() => toast('播放失败')); else audio.pause();
  }
});

/* =========================================================
   二十五、导出 HTML（把当前数据写进网页）
   ========================================================= */
function exportHtml() {
  try {
    persist();
    const clone = document.documentElement.cloneNode(true);
    clone.removeAttribute('style');
    const listEl = clone.querySelector('#list');
    if (listEl) listEl.innerHTML = '';
    const qnEl = clone.querySelector('#quickNav');
    if (qnEl) { qnEl.innerHTML = ''; qnEl.classList.remove('show'); }
    const layoutEl = clone.querySelector('.layout');
    if (layoutEl) layoutEl.classList.remove('with-side');
    const dataEl = clone.querySelector('#radio-data');
    if (dataEl) dataEl.textContent = '\n' + JSON.stringify(stations).replace(/<\//g, '<\\/') + '\n';
    const verEl = clone.querySelector('#radio-version');
    if (verEl) verEl.textContent = JSON.stringify(new Date().toISOString());
    ['#modal', '#stModal', '#toast'].forEach(sel => {
      const el = clone.querySelector(sel);
      if (el) el.classList.remove('show');
    });
    clone.querySelectorAll('.sort-wrap.open').forEach(el => el.classList.remove('open'));
    clone.querySelectorAll('.channel.active').forEach(el => el.classList.remove('active'));
    const bodyEl = clone.querySelector('body');
    if (bodyEl) bodyEl.className = 'locked';
    const html = '<!DOCTYPE html>\n' + clone.outerHTML;
    const blob = new Blob([html], { type: 'text/html;charset=utf-8' });
    const url = URL.createObjectURL(blob);
    const d = new Date();
    const p = n => String(n).padStart(2, '0');
    const fname = '云端网络电台_' + d.getFullYear() + p(d.getMonth() + 1) + p(d.getDate()) + '_' + p(d.getHours()) + p(d.getMinutes()) + '.html';
    const a = document.createElement('a');
    a.href = url;
    a.download = fname;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(() => URL.revokeObjectURL(url), 4000);
    toast('已导出 HTML，数据已内嵌其中');
  } catch (err) {
    toast('导出失败：' + err.message);
  }
}
document.getElementById('exportBtn').addEventListener('click', exportHtml);

/* =========================================================
   二十六、启动
   ========================================================= */
(function showInitHint() {
  try {
    const hintShown = localStorage.getItem('radio_edit_hint_v1');
    if (!hintShown) {
      setTimeout(() => toast('提示：点击右上角 🔒 解锁编辑模式，即可添加/修改电台'), 900);
      localStorage.setItem('radio_edit_hint_v1', '1');
    }
  } catch (e) {}
})();

renderTabs();
restoreLast();
if (currentChannel && currentStation && currentStation.cat !== currentCat) {
  currentCat = currentStation.cat;
  renderTabs();
}
render();
updatePlayerUI();
updateTopbarHeight();
if (currentChannel) {
  setTimeout(() => {
    scrollToActiveCard();
    autoPlayLast();
  }, 80);
}
</script>
