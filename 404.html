<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>页面不存在</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    font-family:"Noto Sans SC","PingFang SC","Microsoft YaHei",system-ui,sans-serif;
    background:#f6f2ea;color:#2f2a24;
    display:flex;align-items:center;justify-content:center;
    padding:24px;text-align:center;line-height:1.8;
  }
  .wrap{max-width:420px}
  .code{
    font-family:Georgia,"Songti SC",serif;
    font-size:64px;font-weight:700;letter-spacing:.08em;
    color:#8c1c13;line-height:1;margin-bottom:18px;
  }
  h1{font-size:20px;font-weight:600;margin-bottom:10px}
  p{font-size:14px;color:#7a7164;margin-bottom:28px}
  a{
    display:inline-block;text-decoration:none;
    color:#f6f2ea;background:#8c1c13;
    padding:11px 26px;border-radius:999px;font-size:14px;
  }
  a:hover{opacity:.9}
</style>
</head>
<body>
  <div class="wrap">
    <div class="code">404</div>
    <h1>页面不存在</h1>
    <p>你要查看的内容可能已移动，或者地址有误。</p>
    <a href="/">返回首页</a>
  </div>
</body>
</html>
